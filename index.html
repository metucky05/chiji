<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>方块吃鸡 · Voxel Battle Royale</title>
<style>
  :root { --ui-font: "Microsoft YaHei", "PingFang SC", monospace, sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: var(--ui-font); }
  #game-canvas { display: block; width: 100%; height: 100%; }

  /* ---------- 通用屏幕 ---------- */
  .screen {
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    z-index: 50; color: #fff; text-align: center;
  }
  .screen h1 {
    font-size: 56px; letter-spacing: 6px; margin-bottom: 12px;
    text-shadow: 0 4px 0 rgba(0,0,0,.45), 0 0 28px rgba(255,255,255,.25);
  }
  .screen .sub { font-size: 16px; opacity: .85; margin-bottom: 26px; line-height: 1.9; }
  .btn {
    font-family: var(--ui-font); font-size: 20px; letter-spacing: 4px;
    padding: 13px 46px; cursor: pointer; color: #fff;
    background: linear-gradient(#5fae3f, #3f8a26); border: 3px solid #2c6418;
    border-radius: 4px; box-shadow: 0 5px 0 #1f4a10; transition: transform .06s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1f4a10; }
  #screen-menu { display: flex; background: linear-gradient(rgba(20,30,18,.55), rgba(10,14,8,.8)); }
  #screen-menu .keys {
    margin-top: 30px; font-size: 13px; color: #cfe4bf; line-height: 2;
    background: rgba(0,0,0,.35); padding: 14px 26px; border-radius: 6px;
  }
  kbd {
    background: #333; border: 1px solid #666; border-bottom-width: 3px;
    border-radius: 4px; padding: 1px 7px; font-family: var(--ui-font); color: #ffe93a;
  }
  #screen-death { background: rgba(60, 8, 8, .72); }
  #screen-death h1 { color: #ff6b57; }
  #screen-win { background: rgba(190, 140, 20, .35); }
  #screen-win h1 { color: #ffe93a; }
  #screen-pause { background: rgba(0,0,0,.6); }

  /* ---------- HUD ---------- */
  #hud { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 10; color: #fff; }
  #crosshair {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 18px; color: rgba(255,255,255,.9); text-shadow: 0 0 4px #000;
  }
  #hitmarker {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 26px; opacity: 0; transition: opacity .12s, transform .12s; text-shadow: 0 0 6px #000;
  }
  #vignette {
    position: absolute; inset: 0; opacity: 0; transition: opacity .25s;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(200,30,20,.55) 100%);
  }
  #hud-bottom {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    width: 420px; text-shadow: 0 1px 3px #000;
  }
  #health-bar {
    height: 16px; background: rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.55);
    border-radius: 4px; overflow: hidden;
  }
  #health-fill { height: 100%; width: 100%; background: #4fc46a; transition: width .15s; }
  #hud-bottom .row { display: flex; justify-content: space-between; margin-top: 6px; font-size: 15px; }
  #weapon-name { opacity: .95; }
  #ammo { font-size: 20px; font-weight: bold; color: #ffe93a; }
  #hud-topright { position: absolute; top: 14px; right: 14px; text-align: right; }
  #minimap {
    border: 2px solid rgba(255,255,255,.6); border-radius: 4px;
    background: #223; image-rendering: pixelated;
  }
  #zone-info { margin-top: 6px; font-size: 14px; text-shadow: 0 1px 3px #000; }
  #zone-info.warn { color: #ff8a3a; font-weight: bold; }
  #hud-topleft {
    position: absolute; top: 14px; left: 14px; font-size: 15px;
    background: rgba(0,0,0,.4); padding: 8px 14px; border-radius: 6px; line-height: 1.8;
  }
  #hud-topleft b { color: #ffe93a; font-size: 18px; }
  #killfeed { position: absolute; top: 90px; right: 14px; text-align: right; font-size: 13px; }
  .feed-item {
    background: rgba(0,0,0,.5); margin-top: 4px; padding: 4px 10px; border-radius: 4px;
    animation: feedin .2s ease-out;
  }
  .feed-item b { color: #ff8a3a; }
  @keyframes feedin { from { transform: translateX(30px); opacity: 0; } }
  #toast {
    position: absolute; left: 50%; top: 24%; transform: translateX(-50%);
    font-size: 18px; color: #ffe93a; text-shadow: 0 2px 4px #000;
    opacity: 0; transition: opacity .3s; white-space: nowrap;
  }
  #drop-tip {
    display: none; position: absolute; left: 50%; top: 60%; transform: translateX(-50%);
    font-size: 16px; color: #bfe9ff; text-shadow: 0 2px 4px #000;
  }
  #interact-tip {
    display: none; position: absolute; left: 50%; top: 58%; transform: translateX(-50%);
    font-size: 14px; color: #fff; text-shadow: 0 1px 3px #000;
  }
  /* 狙击开镜遮罩 */
  #scope-overlay {
    display: none; position: absolute; inset: 0;
    background: radial-gradient(circle at center, transparent 0 29%, rgba(0,0,0,.96) 40%);
  }
  #scope-overlay::before, #scope-overlay::after {
    content: ""; position: absolute; left: 50%; top: 50%; background: rgba(0,0,0,.75);
  }
  #scope-overlay::before { width: 64%; height: 2px; transform: translate(-50%,-50%); }
  #scope-overlay::after { width: 2px; height: 64%; transform: translate(-50%,-50%); }
  /* 简易方块风枪模型 */
  #gun-model {
    position: absolute; right: 16%; bottom: -2%; width: 230px; height: 150px;
    transition: transform .07s; pointer-events: none;
  }
  #gun-model .barrel {
    position: absolute; right: 30px; bottom: 78px; width: 150px; height: 26px;
    background: linear-gradient(#4a4a4a, #2d2d2d); border: 3px solid #1b1b1b;
    transform: rotate(-8deg); border-radius: 3px;
  }
  #gun-model .body {
    position: absolute; right: 18px; bottom: 44px; width: 84px; height: 52px;
    background: linear-gradient(#5a4632, #3c2f22); border: 3px solid #241c14;
    transform: rotate(-8deg); border-radius: 3px;
  }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div id="vignette"></div>
  <div id="scope-overlay"></div>
  <div id="crosshair">＋</div>
  <div id="hitmarker">✕</div>
  <div id="gun-model"><div class="barrel"></div><div class="body"></div></div>
  <div id="hud-topleft">
    存活 <b id="alive-num">16</b> ／ 击杀 <b id="kill-num">0</b>
  </div>
  <div id="hud-topright">
    <canvas id="minimap"></canvas>
    <div id="zone-info">--</div>
  </div>
  <div id="killfeed"></div>
  <div id="toast"></div>
  <div id="drop-tip">🪂 空降中 — WASD 控制漂移方向，自动开伞着陆</div>
  <div id="interact-tip"></div>
  <div id="hud-bottom">
    <div id="health-bar"><div id="health-fill"></div></div>
    <div class="row">
      <span>❤ <span id="health-num">100</span></span>
      <span id="weapon-name">✊ 拳头</span>
      <span id="ammo">∞</span>
    </div>
  </div>
</div>

<!-- 主菜单 -->
<div class="screen" id="screen-menu">
  <h1>方块吃鸡</h1>
  <div class="sub">我的世界版 · 大逃杀<br>16 人空降方块岛，毒圈收缩，活到最后吃鸡！</div>
  <button class="btn" id="btn-start">开 始 游 戏</button>
  <div class="keys">
    <kbd>W A S D</kbd> 移动　<kbd>Shift</kbd> 奔跑　<kbd>空格</kbd> 跳跃　<kbd>鼠标左键</kbd> 射击 / 挥拳拆方块<br>
    <kbd>鼠标右键</kbd> 放置方块搭掩体　<kbd>C</kbd> 开镜瞄准　<kbd>R</kbd> 换弹　<kbd>4</kbd> 医疗包　走近发光箱子自动拾取<br>
    爆头 1.75 倍伤害 · 击杀回血 +15 · <kbd>Esc</kbd> 暂停（全场冻结）
  </div>
</div>

<!-- 死亡 -->
<div class="screen" id="screen-death">
  <h1>淘汰出局</h1>
  <div style="font-size:42px;margin:6px 0 4px;" id="death-rank">#--</div>
  <div class="sub" id="death-info"></div>
  <button class="btn" id="btn-restart-dead">再 来 一 局</button>
</div>

<!-- 吃鸡 -->
<div class="screen" id="screen-win">
  <h1>大吉大利，今晚吃鸡！</h1>
  <div style="font-size:54px;margin:4px 0 8px;">🐔🍗</div>
  <div class="sub" id="win-info"></div>
  <button class="btn" id="btn-restart-win">再 来 一 局</button>
</div>

<!-- 暂停 -->
<div class="screen" id="screen-pause">
  <h1 style="font-size:34px;">已暂停</h1>
  <div class="sub">鼠标已解锁</div>
  <button class="btn" id="btn-resume">继 续 游 戏</button>
</div>

<script src="lib/three.min.js"></script>
<script src="src/audio.js"></script>
<script src="src/world.js"></script>
<script src="src/player.js"></script>
<script src="src/zone.js"></script>
<script src="src/weapons.js"></script>
<script src="src/bots.js"></script>
<script src="src/hud.js"></script>
<script src="src/main.js"></script>
</body>
</html>
